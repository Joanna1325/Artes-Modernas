<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria Desconstruída</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Galeria Desconstruída</h1>

  <main class="gallery-container">
    <!-- Card atualizado com a imagem de Van Gogh -->
    <div class="art-card" data-rotation="-8" data-offset-x="-15">
      <img src="https://totenart.pt/blog/wp-content/uploads/2025/02/van-gogh-cuadro-arte-moderno-1.jpeg" alt="Obra de Vincent van Gogh">
      <div class="art-info">
        <h3>Vincent van Gogh</h3>
        <p>Pós-Impressionismo e expressão através da cor.</p>
      </div>
    </div>

    <div class="art-card" data-rotation="12" data-offset-x="20">
      <img src="https://picsum.photos/id/1062/400/500" alt="Obra de Arte 2">
      <div class="art-info">
        <h3>Obra B</h3>
        <p>Descrição ou conceito da obra.</p>
      </div>
    </div>

    <div class="art-card" data-rotation="-5" data-offset-x="10">
      <img src="https://picsum.photos/id/1069/400/500" alt="Obra de Arte 3">
      <div class="art-info">
        <h3>Obra C</h3>
        <p>Descrição ou conceito da obra.</p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
